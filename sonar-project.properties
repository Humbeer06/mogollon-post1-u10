# sonar-project.properties
# Configuracion del analisis de SonarQube para el proyecto envios-service.
# Nota: el scanner de Maven (mvn sonar:sonar) lee estas mismas claves desde la
# seccion <properties> del pom.xml; este archivo documenta la configuracion y
# sirve si se usara sonar-scanner (CLI).

# Identidad del proyecto en el servidor
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Codigo fuente y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Reporte XML que genera JaCoCo (mvn verify) y que Sonar importa como cobertura
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor local (Docker). El token NO se guarda aqui: se pasa con -Dsonar.token
sonar.host.url=http://localhost:9000

# false: el analisis termina sin esperar el veredicto del Quality Gate
sonar.qualitygate.wait=false

# Sin sonar.exclusions: el proyecto no tiene clase Main ni codigo de arranque,
# todo el codigo es logica de negocio (ver Decision de diseno 2 en el README)
